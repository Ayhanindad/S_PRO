<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماڵپەڕی من</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            width: 300px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .link-btn {
            display: block;
            background-color: #ffffff;
            color: #2a5298;
            padding: 12px;
            margin: 10px 0;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }
        .link-btn:hover {
            background-color: #2a5298;
            color: #ffffff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>بەخێربێیت بۆ ماڵپەڕەکەم</h1>
        <p>پڕۆژەکان و بەستەرەکانم لەم لایەوە ببینە:</p>
        
        <a href="https://tiktok.com" target="_blank" class="link-btn">تیک تۆک</a>
        <a href="https://github.com" target="_blank" class="link-btn">گیتهەبەکەم</a>
        <a href="#" class="link-btn">پڕۆژەی نوێ</a>
    </div>

</body>
</html>
